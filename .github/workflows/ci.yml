name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR updates supersede old commits and label state. Main/release requests still queue
  # by exact commit so a release never cancels the CI it is waiting for.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_checks: ${{ steps.ci.outputs.run_checks }}
      pr_ci_source: ${{ steps.ci.outputs.pr_ci_source }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_e2e: ${{ steps.ci.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR's merge commit and the base it is compared with below.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter throw
      # Only a PR or a push has a change to read; a manual or release request tests the
      # commit, whatever last changed in it. Anything unreadable counts as code.
      - name: Decide whether the change is documentation only
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT_NAME" in
            pull_request) base='HEAD^1' ;;
            push) git fetch --quiet --depth=1 origin "$BEFORE" && base="$BEFORE" || true ;;
          esac
          docs_only=false
          if [[ -n "$base" ]]; then
            docs_only=$(git diff --name-only --no-renames "$base" HEAD | node scripts/change-scope.ts)
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"
      - name: Decide whether to reuse full CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_ONLY: ${{ steps.scope.outputs.docs_only }}
          # `run e2e` always tests. Other PRs wait for `merge on pass` and skip E2E for docs.
          E2E_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'run e2e') || steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge on pass')) }}
        run: |
          echo "run_e2e=$E2E_REQUESTED" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ "$E2E_REQUESTED" == true && "$DOCS_ONLY" == false && "$GITHUB_RUN_ATTEMPT" == 1 &&
                  ( "$EVENT_ACTION" == labeled || "$EVENT_ACTION" == unlabeled ) ]]; then
              node scripts/pr-ci-reuse.ts
            else
              echo 'run_checks=true' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == merge_group ]]; then
            echo 'run_checks=true' >> "$GITHUB_OUTPUT"
          else
            node scripts/wait-for-ci.ts check
          fi

  check:
    needs: reuse
    if: needs.reuse.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Actions run's head_sha is the branch tip, not the merge commit tested here.
      - name: Full CI for PR ${{ github.event.pull_request.number }} at ${{ github.sha }}
        if: github.event_name == 'pull_request' && needs.reuse.outputs.run_e2e == 'true'
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  android-build:
    name: android build
    needs: reuse
    if: needs.reuse.outputs.run_checks == 'true' && needs.reuse.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: pnpm install --frozen-lockfile
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Compile bundled debug apps for all channels
        # One runner and Gradle cache; no emulator, signing secrets or release artifacts.
        run: |
          for channel in dev stable preview; do
            THROW_CHANNEL="$channel" pnpm --filter @throw/web android:sync
            task="assemble${channel^}Debug"
            (cd apps/web/android && ./gradlew "$task" --no-daemon --no-configuration-cache)
          done

  # Each shard has its own runner and dev stack.
  e2e-desktop:
    name: e2e desktop (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: reuse
    if: needs.reuse.outputs.run_checks == 'true' && needs.reuse.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: &e2e-shards
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PROJECT: desktop
    steps: &e2e-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image already has the libraries Chromium links against. Fetching them
      # again goes through apt, which has taken seven minutes on a slow day, so that only
      # happens when a launch shows one is missing.
      - name: Install Chromium
        run: |
          pnpm exec playwright install chromium
          launch="import { chromium } from '@playwright/test'; await (await chromium.launch()).close();"
          node --input-type=module -e "$launch" || pnpm exec playwright install-deps chromium
      # Builds the development image into this builder from layers kept between runs, so its
      # Debian packages are only fetched when the Dockerfile changes. `dev.sh up` then builds
      # the same image and finds every layer here. Writing the image out is what downloads
      # the kept layers: a build with no output reads only their names, and `dev.sh up` would
      # run every step again. One job keeps the layers: each would otherwise store a copy of
      # its own after a change.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          outputs: type=oci,dest=${{ runner.temp }}/dev-image.tar
          cache-from: type=gha,scope=dev-image
          cache-to: ${{ env.PROJECT == 'desktop' && matrix.shard == 1 && 'type=gha,scope=dev-image,mode=max' || '' }}
      # Exercises the same worktree stack developers and agents use.
      - run: ./scripts/dev.sh up
      # The unit tests also run inside the stack, beside a real Postgres, which the check
      # job's bare runner lacks. They and the API tests ride on one project's runner.
      - if: env.PROJECT == 'android' && matrix.shard == 1
        run: ./scripts/dev.sh test
      # The tests that only call the API open no page, so they run once.
      - if: env.PROJECT == 'android' && matrix.shard == 1
        run: ./scripts/dev.sh e2e --project=api --workers=1
      - run: ./scripts/dev.sh e2e --project=$PROJECT --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=1
      - if: failure()
        run: ./scripts/dev.sh logs-once
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ env.PROJECT }}-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  e2e-android:
    name: e2e android (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: reuse
    if: needs.reuse.outputs.run_checks == 'true' && needs.reuse.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: *e2e-shards
    env:
      PROJECT: android
    steps: *e2e-steps

  # One result per project under the names the release workflow waits for
  # (scripts/wait-for-ci.ts), however many runners its tests are split over.
  e2e-desktop-passed:
    name: e2e (desktop)
    needs: [reuse, e2e-desktop]
    if: always() && needs.reuse.outputs.run_checks == 'true' && needs.reuse.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-desktop.result }}" = success

  e2e-android-passed:
    name: e2e (android)
    needs: [reuse, e2e-android]
    if: always() && needs.reuse.outputs.run_checks == 'true' && needs.reuse.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-android.result }}" = success

  # Require this check in branch protection: GitHub accepts conditionally skipped jobs,
  # so requiring the E2E jobs alone would let a PR merge without testing or approval.
  validation:
    name: validation
    needs: [reuse, check, android-build, e2e-desktop-passed, e2e-android-passed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify current approval before reusing PR checks
        id: approval
        if: github.event_name == 'pull_request' && needs.reuse.outputs.pr_ci_source != '' && contains(github.event.pull_request.labels.*.name, 'merge on pass')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const eventPR = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPR.number,
            });
            core.setOutput('current', pr.state === 'open' && pr.base.ref === eventPR.base.ref &&
              pr.head.sha === eventPR.head.sha && pr.labels.some(label => label.name === 'merge on pass'));
      - name: Require completed validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          E2E_REQUESTED: ${{ needs.reuse.outputs.run_e2e }}
          DOCS_ONLY: ${{ needs.reuse.outputs.docs_only }}
          MERGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'merge on pass') }}
          REUSE_RESULT: ${{ needs.reuse.result }}
          RUN_CHECKS: ${{ needs.reuse.outputs.run_checks }}
          PR_CI_SOURCE: ${{ needs.reuse.outputs.pr_ci_source }}
          PR_APPROVED_NOW: ${{ steps.approval.outputs.current }}
          CHECK_RESULT: ${{ needs.check.result }}
          NATIVE_RESULT: ${{ needs.android-build.result }}
          DESKTOP_RESULT: ${{ needs.e2e-desktop-passed.result }}
          ANDROID_RESULT: ${{ needs.e2e-android-passed.result }}
        run: bash scripts/ci-validation.sh
