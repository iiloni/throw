apply plugin: 'com.android.application'

def releaseVersion = providers.environmentVariable('THROW_VERSION').getOrElse('0.0.0-dev')
def releaseVersionCode = providers.environmentVariable('THROW_VERSION_CODE').getOrElse('1').toInteger()
def releaseKeystore = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull

android {
    namespace = "org.iloni.throwtasks"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.iloni.throwtasks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions += 'channel'
    productFlavors {
        // Separate installs protect each channel's accounts, SQLite data and queued writes.
        dev {
            dimension 'channel'
            applicationIdSuffix '.dev'
            isDefault = true
        }
        stable {
            dimension 'channel'
        }
        preview {
            dimension 'channel'
            applicationIdSuffix '.preview'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').orNull
                keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').orNull
                keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').orNull
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'


// Keep unsigned APKs from being mistaken for installable releases, including local builds.
tasks.configureEach { task ->
    if (task.name == 'preDevReleaseBuild') {
        task.doFirst {
            throw new GradleException('The dev flavor is not distributed; build stable or preview for release.')
        }
    }
    if (task.name == 'preStableReleaseBuild' || task.name == 'prePreviewReleaseBuild') {
        task.doFirst {
            def required = ['THROW_VERSION', 'THROW_VERSION_CODE', 'ANDROID_KEYSTORE_PATH',
                            'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
            def missing = required.findAll { !providers.environmentVariable(it).orNull }
            if (missing) {
                throw new GradleException("Release builds require: ${missing.join(', ')}")
            }
            if (releaseVersionCode < 1 || releaseVersionCode > 2100000000) {
                throw new GradleException('THROW_VERSION_CODE must be between 1 and 2100000000')
            }
        }
    }
}
