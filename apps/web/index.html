<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" data-scheme="light" media="(prefers-color-scheme: light)" content="#f7f6f2" />
    <meta name="theme-color" data-scheme="dark" media="(prefers-color-scheme: dark)" content="#23211e" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-mark.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Throw</title>
    <style>
      :root { color-scheme: light dark; }
      :root[data-theme="light"] { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      body { margin: 0; background: light-dark(oklch(0.965 0.008 85), oklch(0.205 0.01 70)); }
    </style>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts).
      try {
        const theme = JSON.parse(localStorage.getItem('throw-theme') ?? 'null');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          // The browser's and installed app's bars follow the chosen theme, not the OS.
          for (const meta of document.querySelectorAll('meta[name="theme-color"][data-scheme]'))
            meta.media = meta.dataset.scheme === theme ? 'all' : 'not all';
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore this device's app icon before the app starts, offline too (src/lib/appIcon.ts).
      try {
        const channel = '__THROW_CHANNEL__';
        const icons = ['stable', 'preview', 'dev'];
        const saved = JSON.parse(localStorage.getItem('throw-app-icon') ?? 'null');
        const icon = icons.indexOf(saved) >= 0 && icons.indexOf(saved) <= icons.indexOf(channel) ? saved : channel;
        const base = icon === 'stable' ? '' : `/${icon}`;
        for (const link of document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]')) {
          const filename = new URL(link.href).pathname.split('/').pop();
          link.href = `${base}/${filename}`;
        }
        const manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.href = `/manifest-${icon}.webmanifest`;
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
